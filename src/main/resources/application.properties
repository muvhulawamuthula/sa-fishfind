# ── SA FishFind API — application config ──────────────────────────

spring.application.name=sa-fishfind-api
server.port=8080

# ── Local dev: H2 in-memory database ─────────────────────────────
spring.datasource.url=jdbc:h2:mem:fishfinddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Use schema.sql to create tables, then data.sql to insert rows
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Make sure SQL init runs before JPA tries anything
spring.jpa.defer-datasource-initialization=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# H2 console for local debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Anthropic API ─────────────────────────────────────────────────
anthropic.api.key=${ANTHROPIC_API_KEY:}

# ── Logging ───────────────────────────────────────────────────────
logging.level.com.safishfind=DEBUG
logging.level.org.springframework.security=WARN
