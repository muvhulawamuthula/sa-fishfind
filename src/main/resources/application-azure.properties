# ── SA FishFind — Azure production profile ────────────────────────
# Activated by: SPRING_PROFILES_ACTIVE=azure (set in Azure App Service)

# ── Azure SQL Database ────────────────────────────────────────────
spring.datasource.url=jdbc:sqlserver://${AZURE_SQL_SERVER}.database.windows.net:1433;database=${AZURE_SQL_DATABASE};encrypt=true;trustServerCertificate=false;loginTimeout=30
spring.datasource.username=${AZURE_SQL_USERNAME}
spring.datasource.password=${AZURE_SQL_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Disable H2 console in production
spring.h2.console.enabled=false

# ── Anthropic API (set in Azure App Service environment variables) ─
anthropic.api.key=${ANTHROPIC_API_KEY}

# ── Azure Blob Storage (for dam/fish images) ──────────────────────
azure.storage.account=${AZURE_STORAGE_ACCOUNT}
azure.storage.key=${AZURE_STORAGE_KEY}
azure.storage.container=fishfind-images

# ── Production logging ────────────────────────────────────────────
logging.level.com.safishfind=INFO
logging.level.org.springframework.security=WARN
