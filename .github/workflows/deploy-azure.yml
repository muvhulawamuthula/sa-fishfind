name: Build and Deploy SA FishFind to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write      # required for OIDC: lets the job request a federated token
  contents: read       # required for actions/checkout

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cache Maven dependencies (speeds up builds)
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # 4. Build the JAR (skip tests on deploy — run separately)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 5. Log in to Azure via OIDC federated credentials (no secrets/passwords)
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 6. Deploy to Azure App Service using the OIDC session above
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sa-fishfind-api'           # Your Azure App Service name
          slot-name: 'production'
          package: target/*.jar
